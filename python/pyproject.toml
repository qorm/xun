[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xun-format"
version = "0.1.1"
description = "XUN (X Unquoted Notation) parser and encoder"
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
